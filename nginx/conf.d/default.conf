# SpaceEzy Nginx reverse proxy — HTTP (port 80).
# TLS is terminated at the Cloudflare edge (or on this host — see
# default.ssl.conf.example). Internet → Cloudflare → here.
#
# Routing:
#   /api/*  → express :8000
#   /*      → next    :3000
# Ports 3000/8000 are never published outside the compose network.

map $http_cf_connecting_ip $client_ip {
    # Cloudflare sets CF-Connecting-IP with the real visitor address.
    default $http_cf_connecting_ip;
    ""      $remote_addr;   # DNS-only / local testing — direct client.
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;   # edge TLS (Cloudflare → origin over http)
    ""      $scheme;
}

upstream spaceezy_next {
    server next:3000;
    keepalive 16;
}

upstream spaceezy_api {
    server express:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Matches the 6 MB application upload limit + JSON payloads.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ---- Canonical host / scheme ---------------------------------------
    # The apex domain is the only canonical origin (see canonical tags).
    # Redirect only on an explicitly known non-canonical request so a missing
    # X-Forwarded-Proto header can never cause a redirect loop.
    if ($host = "www.spaceezy.com") {
        return 301 https://spaceezy.com$request_uri;
    }
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # ---- Media (private S3 bucket, streamed by Express) ----------------
    location /media/ {
        proxy_pass http://spaceezy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # ---- API (Express) --------------------------------------------------
    location /api/ {
        proxy_pass http://spaceezy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /api {
        return 301 /api/;
    }

    # Safe liveness endpoint for uptime monitors (no secrets).
    location = /health {
        proxy_pass http://spaceezy_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header Connection "";
    }

    # ---- Everything else (Next.js) --------------------------------------
    location / {
        proxy_pass http://spaceezy_next;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        # Next.js responses stream; don't buffer them.
        proxy_buffering off;
    }
}
