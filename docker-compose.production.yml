# =============================================================================
# SpaceEzy — production stack for a single EC2 instance (ap-south-1).
# Budget target: ₹1,000–₹1,200 / month.
#
#   Internet → Cloudflare Free (optional) → Nginx :80/:443
#                ├── /       → next     :3000  (Next.js standalone)
#                └── /api    → express  :8000  (Express API)
#   express → PostgreSQL :5432 (container-internal on EC2 with persistent Docker volume)
#   express → AWS S3 (media uploads & automated DB backups via EC2 IAM role)
#   redis   → optional profile (reserved, no application code connects, $0 cost)
#
# Only ports 80/443 are published; 3000/8000/5432/6379 stay container-internal.
#
# Usage (see docs/AWS_DEPLOYMENT.md for the full walkthrough):
#   cp backend/.env.production.example backend/.env.production   # then edit
#   cp .env.production.example .env.production                   # then edit
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
# =============================================================================

name: spaceezy

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: spaceezy-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spaceezy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable required}
      POSTGRES_DB: ${POSTGRES_DB:-spaceezy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spaceezy} -d ${POSTGRES_DB:-spaceezy}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.29-alpine
    container_name: spaceezy-nginx
    depends_on:
      express:
        condition: service_healthy
      next:
        condition: service_healthy
    ports:
      - "80:80"
      # After placing origin TLS certs, also uncomment (docs §SSL/HTTPS):
      # - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 64m

  express:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spaceezy-express
    env_file:
      - ./backend/.env.production
    environment:
      NODE_ENV: production
      PORT: "8000"
      # Trust the compose network as the reverse-proxy hop so req.ip (rate
      # limiting) uses the X-Forwarded-For client set by Nginx.
      TRUST_PROXY: "172.16.0.0/12"
    depends_on:
      postgres:
        condition: service_healthy
    # Internal only — never published on the host.
    expose:
      - "8000"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  next:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Browser-visible API base URL (inlined at build time).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        # Optional heap cap for the build on 2 GB hosts:
        NODE_OPTIONS: ${BUILD_NODE_OPTIONS:-}
    container_name: spaceezy-next
    environment:
      # Server-side (SSR/ISR) API base URL — container-internal, no hairpin.
      API_URL: ${API_URL:-http://express:8000/api/v1}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
    depends_on:
      express:
        condition: service_healthy
    expose:
      - "3000"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # OPTIONAL — reserved for future shared state (rate limiting, ISR cache).
  # No application code connects today, so this stays behind a compose profile:
  #   docker compose -f docker-compose.production.yml --env-file .env.production --profile redis up -d
  # Never published on any host port (container-internal only).
  redis:
    profiles: ["redis"]
    image: redis:7.4-alpine
    container_name: spaceezy-redis
    command:
      - redis-server
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:-changeme}
    expose:
      - "6379"
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 96m
    healthcheck:
      # NOAUTH is an acceptable liveness answer when a password is required.
      test: ["CMD-SHELL", "redis-cli ping | grep -qE 'PONG|NOAUTH' || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
